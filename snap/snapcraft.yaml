# Run Snapcraft from the repository root, not from blue_serial/.
name: blue-serial
title: Blue Serial
base: core22
# Flutter Linux supports x64 and ARM64. Build each package natively;
# the Snap Store build service must not schedule unsupported CPU targets.
architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [arm64]
    build-for: [arm64]
adopt-info: blue-serial
summary: USB serial monitor and terminal with ASCII and HEX support
description: |
  Blue Serial is an open source serial monitor and terminal for USB serial
  devices, microcontrollers and development boards. View received and sent
  bytes, send ASCII or HEX commands, choose CR/LF line endings, save commands
  and export traffic logs. The interface supports English and Turkish.

  Commands and preferences are stored locally. No account is required.

  After installation, enable USB serial access with:
    sudo snap connect blue-serial:raw-usb

  Your user must also have permission to access the serial device. This snap
  targets USB serial adapters exposed as /dev/ttyUSB* or /dev/ttyACM*.
grade: stable
confinement: strict
license: MIT
website: https://github.com/ysfgrl/blue_serial_lib
source-code: https://github.com/ysfgrl/blue_serial_lib
issues: https://github.com/ysfgrl/blue_serial_lib/issues
icon: snap/gui/blue-serial.png

slots:
  blue-serial-dbus:
    interface: dbus
    bus: session
    name: com.ysfgrl.blue_serial

apps:
  blue-serial:
    command: blue_serial
    extensions: [gnome]
    plugs:
      # Linux uses kernel TTY devices, not Android's USB driver. raw-usb
      # permits ttyUSB/ttyACM access and /proc/tty/drivers for enumeration.
      - raw-usb
      # The Linux file exporter saves explicitly requested logs to Downloads.
      - home
    slots:
      - blue-serial-dbus

parts:
  blue-serial:
    plugin: flutter
    flutter-channel: stable
    source: .
    # Keep the full repository: the application's path dependency is ../.
    source-subdir: blue_serial
    flutter-target: lib/main.dart
    build-packages:
      - libgtk-3-dev
      - liblzma-dev
      - pkg-config
    override-build: |
      craftctl default
      app_version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' "$CRAFT_PART_SRC/blue_serial/pubspec.yaml")"
      test -n "$app_version"
      craftctl set version="$app_version"
      install -Dm644 "$CRAFT_PART_SRC/LICENSE" "$CRAFT_PART_INSTALL/usr/share/licenses/blue-serial/LICENSE"
